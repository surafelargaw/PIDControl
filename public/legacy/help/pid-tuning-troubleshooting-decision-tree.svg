<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1680" role="img" aria-labelledby="title desc">
  <title id="title">PID tuning troubleshooting decision tree</title>
  <desc id="desc">A decision tree for checking loop basics, identifying the primary PID symptom, choosing likely causes, and validating the tuned loop from trend data.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 42px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 19px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .box-blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 16; }
      .box-green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 16; }
      .box-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 16; }
      .box-red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 16; }
      .box-violet { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; rx: 16; }
      .box-cyan { fill: #ecfeff; stroke: #22d3ee; stroke-width: 2; rx: 16; }
      .box-slate { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 16; }
      .label { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 17px Arial, sans-serif; fill: #334155; }
      .small { font: 400 15px Arial, sans-serif; fill: #475569; }
      .badge { font: 700 14px Arial, sans-serif; fill: #ffffff; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #94a3b8; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect class="bg" width="1400" height="1680" />
  <text x="700" y="68" text-anchor="middle" class="title">PID Tuning Troubleshooting Decision Tree</text>
  <text x="700" y="102" text-anchor="middle" class="subtitle">Verify basics first, then branch by the trend symptom before changing gains.</text>

  <rect x="570" y="132" width="260" height="64" rx="32" fill="#0f172a" />
  <text x="700" y="172" text-anchor="middle" class="badge" style="font-size:22px">START</text>

  <path class="line" d="M700 196 L700 232" />

  <rect class="box-blue" x="420" y="232" width="560" height="160" />
  <text x="700" y="267" text-anchor="middle" class="label">Step 1: Verify Basics</text>
  <text x="455" y="306" class="text">Check AUTO mode, sensor accuracy, actuator response,</text>
  <text x="455" y="332" class="text">signal scaling/filtering, and competing loops or overrides.</text>
  <text x="455" y="365" class="small">If any check fails, fix hardware or logic before tuning.</text>

  <path class="line" d="M700 392 L700 430" />

  <rect class="box-green" x="480" y="430" width="440" height="94" />
  <text x="700" y="466" text-anchor="middle" class="label">Basics Pass?</text>
  <text x="700" y="497" text-anchor="middle" class="text">Yes: identify the primary trend symptom</text>

  <path class="line-soft" d="M480 477 L305 477 L305 560" />
  <rect class="box-red" x="110" y="560" width="390" height="102" />
  <text x="305" y="595" text-anchor="middle" class="label">No</text>
  <text x="135" y="628" class="text">Fix hardware, signal, or sequence logic.</text>
  <text x="135" y="652" class="small">This is not a tuning issue yet.</text>

  <path class="line" d="M700 524 L700 576" />
  <rect class="box-slate" x="510" y="576" width="380" height="88" />
  <text x="700" y="611" text-anchor="middle" class="label">Step 2: Select Symptom</text>
  <text x="700" y="641" text-anchor="middle" class="text">Use PV, SP, and output trend behavior.</text>

  <path class="line-soft" d="M700 664 L700 724" />
  <path class="line-soft" d="M700 724 L230 724 L230 774" />
  <path class="line-soft" d="M700 724 L700 774" />
  <path class="line-soft" d="M700 724 L1170 724 L1170 774" />

  <rect class="box-amber" x="50" y="774" width="360" height="185" />
  <text x="230" y="810" text-anchor="middle" class="label">A. Oscillations</text>
  <text x="82" y="846" class="text">Slow large swings:</text>
  <text x="82" y="872" class="small">Reduce Kp; slow integral.</text>
  <text x="82" y="906" class="text">Fast cycling:</text>
  <text x="82" y="932" class="small">Reduce Kd; filter noisy PV.</text>

  <rect class="box-violet" x="520" y="774" width="360" height="185" />
  <text x="700" y="810" text-anchor="middle" class="label">B. Overshoot</text>
  <text x="552" y="846" class="text">Step overshoot:</text>
  <text x="552" y="872" class="small">Reduce Kp or Ki.</text>
  <text x="552" y="906" class="text">Long settling:</text>
  <text x="552" y="932" class="small">Check windup and limits.</text>

  <rect class="box-cyan" x="990" y="774" width="360" height="185" />
  <text x="1170" y="810" text-anchor="middle" class="label">C. Slow Response</text>
  <text x="1022" y="846" class="text">Long rise time:</text>
  <text x="1022" y="872" class="small">Increase Kp gradually.</text>
  <text x="1022" y="906" class="text">Lagging/sticky:</text>
  <text x="1022" y="932" class="small">Reduce excess Ki or Kd.</text>

  <path class="line-soft" d="M700 724 L230 1040 L230 1090" />
  <path class="line-soft" d="M700 724 L700 1090" />
  <path class="line-soft" d="M700 724 L1170 1040 L1170 1090" />

  <rect class="box-green" x="50" y="1090" width="360" height="185" />
  <text x="230" y="1126" text-anchor="middle" class="label">D. Steady-State Error</text>
  <text x="82" y="1162" class="text">PV stabilizes off setpoint:</text>
  <text x="82" y="1188" class="small">Increase Ki slowly.</text>
  <text x="82" y="1222" class="text">Offset with saturated output:</text>
  <text x="82" y="1248" class="small">Fix capacity, limits, or authority.</text>

  <rect class="box-red" x="520" y="1090" width="360" height="185" />
  <text x="700" y="1126" text-anchor="middle" class="label">E. Noisy Output</text>
  <text x="552" y="1162" class="text">PV fluctuates rapidly:</text>
  <text x="552" y="1188" class="small">Verify sensor and placement.</text>
  <text x="552" y="1222" class="text">Jitter with derivative:</text>
  <text x="552" y="1248" class="small">Reduce or remove Kd.</text>

  <rect class="box-blue" x="990" y="1090" width="360" height="185" />
  <text x="1170" y="1126" text-anchor="middle" class="label">F. Saturation / Windup</text>
  <text x="1022" y="1162" class="text">Output pegged at limit:</text>
  <text x="1022" y="1188" class="small">Reduce Ki; add anti-windup.</text>
  <text x="1022" y="1222" class="text">Overshoot after release:</text>
  <text x="1022" y="1248" class="small">Lower reset; check capacity.</text>

  <path class="line-soft" d="M230 959 L230 1360 L700 1360" />
  <path class="line-soft" d="M700 959 L700 1360" />
  <path class="line-soft" d="M1170 959 L1170 1360 L700 1360" />
  <path class="line-soft" d="M230 1275 L230 1360 L700 1360" />
  <path class="line-soft" d="M700 1275 L700 1360" />
  <path class="line-soft" d="M1170 1275 L1170 1360 L700 1360" />

  <rect class="box-slate" x="440" y="1360" width="520" height="132" />
  <text x="700" y="1398" text-anchor="middle" class="label">End: Validate With Trend</text>
  <text x="475" y="1436" class="text">Check rise time, overshoot, settling, output limits,</text>
  <text x="475" y="1462" class="text">and stability over 3 to 5 representative cycles.</text>
  <text x="475" y="1488" class="small">Document Kp, Ki or integral time, Kd, filters, and limits.</text>

  <path class="line" d="M700 1492 L700 1532" />
  <rect x="580" y="1532" width="240" height="64" rx="32" fill="#0f172a" />
  <text x="700" y="1572" text-anchor="middle" class="badge" style="font-size:22px">END</text>
</svg>
