<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Relay autotune</title>
  <desc id="desc">Relay autotune with stepped output and resulting process oscillation with amplitude a and period Pu.</desc>
  <defs>
    <style>
      .bg { fill: #f6f9f4; }
      .panel { fill: #fff; stroke: #cfd8cd; stroke-width: 2; rx: 24; }
      .axis { stroke: #203028; stroke-width: 3; }
      .out { fill: none; stroke: #da5d3f; stroke-width: 6; }
      .pv { fill: none; stroke: #2c56d0; stroke-width: 6; }
      .guide { stroke: #1e6f5c; stroke-width: 3; stroke-dasharray: 10 8; }
      .txt { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #203028; }
      .sub { font: 400 20px 'Segoe UI', Arial, sans-serif; fill: #55675f; }
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #203028; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <rect x="80" y="110" width="1040" height="580" class="panel"/>
  <line x1="150" y1="390" x2="1040" y2="390" class="guide"/>
  <path class="pv" d="M170 250 C240 310 300 310 360 250 C420 190 500 190 560 250 C620 310 700 310 760 250 C820 190 900 190 960 250 C985 274 1000 286 1020 286"/>
  <path class="out" d="M170 520 L260 520 L260 470 L410 470 L410 560 L560 560 L560 470 L710 470 L710 560 L860 560 L860 470 L1020 470"/>
  <line x1="560" y1="180" x2="560" y2="390" class="guide"/>
  <text x="580" y="210" class="label">a = PV oscillation amplitude</text>
  <text x="736" y="170" class="label">Pu = one oscillation period</text>
  <text x="840" y="448" class="label">2h output span</text>
  <text x="600" y="70" text-anchor="middle" class="txt" style="font-size:34px">Relay autotune creates a measurable limit cycle</text>
  <text x="600" y="718" text-anchor="middle" class="sub">The app measures h, a, and Pu, then estimates Ku from Ku = 4h / (pi a).</text>
</svg>
