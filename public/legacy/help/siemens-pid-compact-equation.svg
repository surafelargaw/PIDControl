<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">Siemens PID_Compact PIDT1 training equation</title>
  <desc id="desc">Training diagram showing PID_Compact as weighted proportional action plus integral action plus filtered derivative action.</desc>
  <rect width="980" height="300" rx="24" fill="#0f172a"/>
  <rect x="28" y="28" width="924" height="244" rx="18" fill="#111827" stroke="#38bdf8" stroke-opacity=".45" stroke-width="2"/>
  <text x="54" y="64" fill="#e5f3ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">PID_Compact algorithm, dead zone deactivated</text>
  <text x="54" y="108" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Training form based on Siemens PIDT1 description with proportional and derivative weighting.</text>

  <text x="70" y="170" fill="#f8fafc" font-family="Georgia, serif" font-size="32">y = Kp [ (b w - x) +</text>
  <text x="390" y="148" fill="#f8fafc" font-family="Georgia, serif" font-size="24">1</text>
  <line x1="372" y1="158" x2="430" y2="158" stroke="#f8fafc" stroke-width="2"/>
  <text x="372" y="187" fill="#f8fafc" font-family="Georgia, serif" font-size="24">TI s</text>
  <text x="446" y="170" fill="#f8fafc" font-family="Georgia, serif" font-size="32">(w - x) +</text>
  <text x="665" y="148" fill="#f8fafc" font-family="Georgia, serif" font-size="24">TD s</text>
  <line x1="642" y1="158" x2="736" y2="158" stroke="#f8fafc" stroke-width="2"/>
  <text x="642" y="187" fill="#f8fafc" font-family="Georgia, serif" font-size="24">a TD s + 1</text>
  <text x="752" y="170" fill="#f8fafc" font-family="Georgia, serif" font-size="32">(c w - x) ]</text>

  <g font-family="Arial, sans-serif" font-size="15" fill="#cbd5e1">
    <text x="70" y="232">P branch: b weights setpoint in proportional action.</text>
    <text x="70" y="254">I branch: TI sets reset strength through accumulated error.</text>
    <text x="520" y="232">D branch: c weights setpoint, and a x TD filters derivative action.</text>
    <text x="520" y="254">Anti-windup and output limiting act after the PIDT1 sum.</text>
  </g>
</svg>
